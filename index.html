<title>TOON RADAR — 만화·웹툰·애니 기회 레이더</title>
<style>
  :root{
    --bg:#08090b; --bg2:#101114; --panel:#131418; --panel2:#181a1f;
    --line:#24262c; --line2:#31343c;
    --ink:#e6e8ec; --mut:#8b8f99; --dim:#5c606a;
    --kr:#5ec8a0; --award:#f6b93b; --award-ink:#08090b; --fest:#c792ea; --fund:#5aa9f6;
    --ft:#ff8fb1; --fg:#f0a868; --fa:#63d2ff; --fi:#a78bfa;
    --urgent:#ff6b6b;
    --sans:-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --mono:ui-monospace,"Cascadia Mono","Consolas","D2Coding",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, #17151c 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 10%, #121316 0%, transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--sans);
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px}
  a{color:inherit}

  header{border-bottom:1px solid var(--line); background:linear-gradient(180deg,#101114 0%,#08090b 100%)}
  .appbar{display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:22px 0 12px; flex-wrap:wrap}
  .brand{display:flex; align-items:baseline; gap:12px}
  .radar{width:11px;height:11px;border-radius:50%;background:var(--ft);position:relative;transform:translateY(-1px);box-shadow:0 0 0 0 rgba(255,143,177,.5);animation:ping 2.6s ease-out infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,143,177,.5)}70%{box-shadow:0 0 0 12px rgba(255,143,177,0)}100%{box-shadow:0 0 0 0 rgba(255,143,177,0)}}
  @media (prefers-reduced-motion:reduce){.radar{animation:none}}
  h1{font-size:22px; letter-spacing:.16em; font-weight:800; margin:0; font-family:var(--mono)}
  .sub{color:var(--mut); font-size:13px; letter-spacing:.02em}
  .build{font-family:var(--mono); font-size:10px; color:var(--dim); border:1px solid var(--line2); border-radius:5px; padding:1px 5px; margin-left:4px}
  .today{font-family:var(--mono); font-size:12px; color:var(--mut); text-align:right}
  .today b{color:var(--ink)}
  .stats{display:flex; gap:8px; margin:4px 0 0; flex-wrap:wrap; justify-content:flex-end}
  .stat{font-family:var(--mono); font-size:12px; padding:4px 10px; border:1px solid var(--line2); border-radius:999px; color:var(--mut)}
  .stat b{color:var(--ink); font-variant-numeric:tabular-nums}
  .stat.hot b{color:var(--urgent)}
  .stat.ok b{color:var(--kr)}

  .tabs{display:flex; gap:4px; padding:2px 0 0; flex-wrap:wrap}
  .tab{font-family:var(--mono); font-size:12.5px; letter-spacing:.02em; padding:9px 15px; border:1px solid var(--line); border-bottom:0; border-radius:10px 10px 0 0; background:transparent; color:var(--mut); cursor:pointer}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--panel); color:var(--ink); border-color:var(--line2); font-weight:700}
  .tab .cnt{font-size:11px; color:var(--dim); margin-left:6px}
  .tab[aria-selected="true"] .cnt{color:var(--mut)}

  .note{color:var(--dim); font-size:11.5px; padding:10px 0 12px; letter-spacing:.01em}
  .note b{color:var(--mut); font-weight:600}

  .controls{position:sticky; top:0; z-index:20; background:rgba(8,9,11,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:12px 0}
  .searchrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .search{flex:1; min-width:200px; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line2); border-radius:10px; padding:9px 12px}
  .search input{flex:1; background:transparent; border:0; outline:none; color:var(--ink); font-family:var(--sans); font-size:14px}
  .search input::placeholder{color:var(--dim)}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; align-items:center}
  .chip{font-family:var(--mono); font-size:12px; letter-spacing:.02em; padding:6px 12px; border-radius:999px; border:1px solid var(--line2); background:var(--panel); color:var(--mut); cursor:pointer; transition:.12s; user-select:none}
  .chip:hover{border-color:var(--dim); color:var(--ink)}
  .chip[aria-pressed="true"]{color:#08090b; font-weight:700; border-color:transparent; background:#fff}
  .chip.f-t[aria-pressed="true"]{background:var(--ft)} .chip.f-g[aria-pressed="true"]{background:var(--fg)}
  .chip.f-a[aria-pressed="true"]{background:var(--fa)} .chip.f-i[aria-pressed="true"]{background:var(--fi)}
  .chip.c-kr[aria-pressed="true"]{background:var(--kr)} .chip.c-award[aria-pressed="true"]{background:var(--award)}
  .chip.c-fest[aria-pressed="true"]{background:var(--fest)} .chip.c-fund[aria-pressed="true"]{background:var(--fund)}
  .chip.favtoggle{border-color:color-mix(in srgb, var(--award) 55%, transparent)}
  .chip.favtoggle[aria-pressed="true"]{background:var(--award); color:var(--award-ink)}
  .chip.opentoggle{border-color:color-mix(in srgb, var(--kr) 55%, transparent)}
  .chip.opentoggle[aria-pressed="true"]{background:var(--kr); color:#08090b}
  .chip.sorttoggle[aria-pressed="true"]{background:var(--fund); color:#08090b}
  .chip.remotetoggle{border-color:color-mix(in srgb, var(--fa) 55%, transparent)}
  .chip.remotetoggle[aria-pressed="true"]{background:var(--fa); color:#08090b}
  .bdg.onsite{color:var(--fg); border:1px solid color-mix(in srgb,var(--fg) 45%,transparent)}
  .group-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;align-self:center;margin-right:2px}
  .monthnav{display:flex; gap:4px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:thin}
  .mbtn{flex:none; font-family:var(--mono); font-size:12px; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--mut); cursor:pointer; text-decoration:none}
  .mbtn:hover{color:var(--ink);border-color:var(--line2)}
  .mbtn.now{color:var(--award-ink); background:var(--award); border-color:transparent; font-weight:700}

  main{padding:26px 0 110px}
  .view{display:none} .view.active{display:block}
  .block{margin:0 0 30px; scroll-margin-top:210px}
  .mhead{display:flex; align-items:baseline; gap:12px; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line)}
  .mhead .mo{font-family:var(--mono); font-size:19px; font-weight:800}
  .mhead .cnt{font-family:var(--mono); font-size:12px; color:var(--dim)}
  .mhead .tag{margin-left:auto; font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--award); border:1px solid var(--award); border-radius:999px; padding:3px 10px}
  .block.current .mhead .mo{color:var(--award)}
  .block.featured{background:linear-gradient(180deg,rgba(246,185,59,.06),transparent 70%); border:1px solid rgba(246,185,59,.22); border-radius:16px; padding:18px 18px 6px}
  .featured .mhead{border-color:rgba(246,185,59,.25)}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px}
  .card{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 15px 12px; transition:.13s}
  .card:hover{border-color:var(--line2); background:var(--panel2)}
  .card.picked{border-color:var(--fund); box-shadow:0 0 0 1px rgba(90,169,246,.35)}
  .ctop{display:flex; align-items:flex-start; gap:8px; margin-bottom:7px; padding-right:52px}
  .cdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px}
  .cname{font-weight:700; font-size:14.5px; line-height:1.35}
  .cmeta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px}
  .fb{font-family:var(--mono); font-size:10.5px; padding:2px 7px; border-radius:6px; border:1px solid var(--line2); color:var(--mut)}
  .fb.t{color:var(--ft);border-color:color-mix(in srgb,var(--ft) 40%,transparent)}
  .fb.g{color:var(--fg);border-color:color-mix(in srgb,var(--fg) 40%,transparent)}
  .fb.a{color:var(--fa);border-color:color-mix(in srgb,var(--fa) 40%,transparent)}
  .fb.i{color:var(--fi);border-color:color-mix(in srgb,var(--fi) 40%,transparent)}
  .loc{font-family:var(--mono); font-size:11px; color:var(--dim)}
  .bdg{font-family:var(--mono); font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px}
  .bdg.urgent{background:var(--urgent); color:#0b0708}
  .bdg.open{background:color-mix(in srgb,var(--kr) 20%,transparent); color:var(--kr); border:1px solid color-mix(in srgb,var(--kr) 45%,transparent)}
  .bdg.hold{background:color-mix(in srgb,var(--fest) 20%,transparent); color:var(--fest); border:1px solid color-mix(in srgb,var(--fest) 45%,transparent)}
  .bdg.roll{color:var(--mut); border:1px solid var(--line2)}
  .bdg.wait{color:var(--dim); border:1px solid var(--line)}
  .csub{font-family:var(--mono); font-size:11.5px; color:var(--mut); border:1px dashed var(--line2); border-radius:8px; padding:5px 9px; margin-bottom:9px}
  .csub.now{color:var(--kr); border-color:color-mix(in srgb,var(--kr) 50%,transparent); border-style:solid; background:color-mix(in srgb,var(--kr) 8%,transparent)}
  .bdg.rst{color:var(--urgent); border:1px solid color-mix(in srgb,var(--urgent) 45%,transparent)}
  .cdesc{font-size:12.5px; color:var(--mut); line-height:1.55; margin-bottom:9px}
  .crun{font-size:11.5px; line-height:1.5; color:var(--fa); background:color-mix(in srgb,var(--fa) 9%,transparent); border:1px solid color-mix(in srgb,var(--fa) 22%,transparent); border-radius:8px; padding:6px 9px; margin-bottom:9px}
  .crun.none{color:var(--dim); background:transparent; border-color:var(--line)}
  .celig{font-size:11.5px; line-height:1.5; color:var(--kr); background:color-mix(in srgb,var(--kr) 9%,transparent); border:1px solid color-mix(in srgb,var(--kr) 22%,transparent); border-radius:8px; padding:6px 9px; margin-bottom:9px}
  .celig.no{color:var(--urgent); background:color-mix(in srgb,var(--urgent) 9%,transparent); border-color:color-mix(in srgb,var(--urgent) 30%,transparent)}
  .chip.krtoggle{border-color:color-mix(in srgb, var(--ft) 55%, transparent)}
  .chip.krtoggle[aria-pressed="true"]{background:var(--ft); color:#08090b}
  .cwhen{font-family:var(--mono); font-size:11.5px; color:var(--ink); opacity:.8; margin-bottom:9px}
  .cfoot{display:flex; gap:6px; align-items:center; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:9px}
  .lnk{font-family:var(--mono); font-size:11.5px; color:var(--fund); text-decoration:none; border:1px solid color-mix(in srgb,var(--fund) 35%,transparent); border-radius:7px; padding:4px 9px}
  .lnk:hover{background:color-mix(in srgb,var(--fund) 15%,transparent)}
  .mini{font-family:var(--mono); font-size:11.5px; color:var(--mut); background:transparent; border:1px solid var(--line2); border-radius:7px; padding:4px 9px; cursor:pointer}
  .mini:hover{color:var(--ink); border-color:var(--dim)}
  .mini.on{color:var(--kr); border-color:color-mix(in srgb,var(--kr) 45%,transparent)}
  .cbtns{position:absolute; top:11px; right:11px; display:flex; gap:4px; align-items:center}
  .icb{width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--dim);cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
  .icb:hover{color:var(--ink);border-color:var(--dim)}
  .icb.fav.on{color:var(--award); border-color:var(--award)}
  .icb.pick.on{color:#08090b; background:var(--fund); border-color:var(--fund); font-weight:700}

  .sel{position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(13,14,18,.96); backdrop-filter:blur(10px); border-top:1px solid var(--line2); transform:translateY(110%); transition:.18s}
  .sel.on{transform:none}
  .selin{display:flex; align-items:center; gap:10px; padding:12px 0; flex-wrap:wrap}
  .selin .n{font-family:var(--mono); font-size:13px}
  .selin .n b{color:var(--fund); font-size:15px}
  .btn{font-family:var(--mono); font-size:12.5px; padding:8px 14px; border-radius:9px; border:1px solid var(--line2); background:var(--panel); color:var(--ink); cursor:pointer}
  .btn:hover{border-color:var(--dim)}
  .btn.pri{background:var(--fund); color:#08090b; border-color:transparent; font-weight:700}
  .btn.ghost{background:transparent; color:var(--mut)}

  .modal{position:fixed; inset:0; z-index:60; background:rgba(4,5,7,.75); display:none; align-items:center; justify-content:center; padding:24px}
  .modal.on{display:flex}
  .mbox{background:var(--panel); border:1px solid var(--line2); border-radius:16px; width:min(760px,100%); max-height:86vh; display:flex; flex-direction:column; overflow:hidden}
  .mhd{display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--line)}
  .mhd b{font-size:15px} .mhd .x{margin-left:auto}
  .mbd{padding:16px 18px; overflow:auto}
  .mbd textarea{width:100%; min-height:300px; background:var(--bg2); border:1px solid var(--line2); border-radius:10px; color:var(--ink); font-family:var(--mono); font-size:12.5px; line-height:1.6; padding:12px; resize:vertical}
  .mbd input[type=text]{width:100%; background:var(--bg2); border:1px solid var(--line2); border-radius:10px; color:var(--ink); font-family:var(--mono); font-size:13px; padding:10px 12px; margin-bottom:10px}
  .mft{display:flex; gap:8px; padding:13px 18px; border-top:1px solid var(--line); flex-wrap:wrap}
  .hint{font-size:11.5px; color:var(--dim); margin:8px 0 0}

  .sec{margin:0 0 26px}
  .sechd{display:flex; align-items:baseline; gap:10px; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line)}
  .sechd .t{font-family:var(--mono); font-size:16px; font-weight:800}
  .sechd .c{font-family:var(--mono); font-size:12px; color:var(--dim)}
  .empty{color:var(--dim); font-size:13px; padding:40px 0; text-align:center}
  .tnum{font-family:var(--mono); font-size:13.5px; font-weight:700; color:var(--award); letter-spacing:.01em; margin-bottom:8px; font-variant-numeric:tabular-nums}
  .tnote{background:var(--panel); border:1px solid var(--line2); border-radius:12px; padding:12px 15px; font-size:12.5px; color:var(--mut); margin-bottom:22px; line-height:1.6}
  .tnote b{color:var(--ink)}
  .feeds{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-top:12px}
  .feed{font-family:var(--mono); font-size:11.5px; text-decoration:none; color:var(--mut); border:1px solid var(--line2); border-radius:999px; padding:5px 11px}
  .feed:hover{color:var(--ink); border-color:var(--dim)}
  .st{font-family:var(--mono); font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line2); color:var(--mut); background:transparent; cursor:pointer}
  .st.s1{color:var(--fund); border-color:color-mix(in srgb,var(--fund) 45%,transparent)}
  .st.s2{color:var(--fest); border-color:color-mix(in srgb,var(--fest) 45%,transparent)}
  .st.s3{color:var(--kr); border-color:color-mix(in srgb,var(--kr) 45%,transparent)}
  footer{border-top:1px solid var(--line); padding:22px 0 40px; color:var(--dim); font-size:12px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#24262c;border-radius:6px}
  :focus-visible{outline:2px solid var(--fa); outline-offset:2px; border-radius:6px}
  .cnt,.c,.loc,.bdg,.today{font-variant-numeric:tabular-nums}
  /* 필터 접기 — 미디어쿼리에 기대지 않는다(아티팩트는 iframe 안이라 폭 조건이 어긋날 수 있음).
     JS가 폭을 재서 넓을 때만 .open을 미리 켜고, 그 외에는 항상 접힌 채 시작한다. */
  /* 접기 버튼은 항상 첫 줄 맨 앞에 — 좁아져도 줄바꿈으로 밀려나지 않게 flex:none */
  .filtoggle{flex:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    font-family:var(--mono); font-size:13px; font-weight:700; cursor:pointer;
    background:var(--panel); color:var(--ink); border:1px solid var(--fa); border-radius:10px; padding:10px 14px}
  .filtoggle:hover{background:var(--panel2)}
  .filtoggle #filN{color:var(--fa)}
  .filtoggle[aria-pressed="true"]{background:var(--fa); color:#08090b; border-color:transparent}
  .filtoggle[aria-pressed="true"] #filN{color:#08090b}
  .search{min-width:120px}
  /* 펼친 필터의 맨 아래(월 네비 밑)에도 접기 버튼 — 아래까지 내려온 상태에서 바로 닫을 수 있게 */
  .filclose{display:block; width:100%; margin:10px 0 2px; padding:9px 0; cursor:pointer;
    font-family:var(--mono); font-size:12.5px; font-weight:700;
    background:var(--panel); color:var(--fa); border:1px solid var(--line2); border-radius:10px}
  .filclose:hover{border-color:var(--fa)}
  #filters{display:none}
  #filters.open{display:block}
  /* 좁은 화면에서는 펼쳐도 각 줄이 한 줄로 유지되어 옆으로 밀린다 */
  body.narrow #filters .chips{flex-wrap:nowrap; overflow-x:auto; padding-bottom:5px; scrollbar-width:thin}
  body.narrow #filters .chip{flex:none}
  body.narrow .tabs{overflow-x:auto; flex-wrap:nowrap; scrollbar-width:thin}
  body.narrow .tab{flex:none}
  @media (max-width:640px){
    .appbar{padding-bottom:10px} .today{text-align:left} .stats{justify-content:flex-start}
    .grid{grid-template-columns:1fr} .block.featured{padding:14px 12px 4px}
    .selin{gap:6px} .selin .btn{flex:1}
    .wrap{padding:0 14px}
  }
</style>

<header>
  <div class="wrap">
    <div class="appbar">
      <div class="brand">
        <span class="radar"></span>
        <div>
          <h1>TOON RADAR</h1>
          <div class="sub">만화 · 웹툰 · 그래픽노블 · 애니메이션 · AI 애니 기회 레이더 <span class="build">build 0807-h</span></div>
        </div>
      </div>
      <div class="today">
        <div>오늘 <b id="tdy"></b></div>
        <div class="stats">
          <span class="stat">기회 <b id="s1"></b></span>
          <span class="stat ok">지금 접수 중 <b id="s4"></b></span>
          <span class="stat hot">이달 마감 <b id="s2"></b></span>
          <span class="stat">★ <b id="s3"></b></span>
        </div>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" data-tab="cal" role="tab" aria-selected="true">📅 공모전·어워드 캘린더<span class="cnt" id="n-cal"></span></button>
      <button class="tab" data-tab="plat" role="tab" aria-selected="false">🏢 플랫폼·출판사<span class="cnt" id="n-plat"></span></button>
      <button class="tab" data-tab="media" role="tab" aria-selected="false">🎥 리뷰어·미디어<span class="cnt" id="n-media"></span></button>
      <button class="tab" data-tab="trend" role="tab" aria-selected="false">📰 트렌드·인기 콘텐츠<span class="cnt" id="n-trend"></span></button>
    </div>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="searchrow">
      <button class="filtoggle" id="filToggle" aria-pressed="false">
        <span id="filArrow">▼</span> <span id="filLabel">필터 열기</span><span id="filN"></span>
      </button>
      <div class="search">
        <span style="opacity:.5">🔍</span>
        <input id="q" type="text" placeholder="이름 · 나라 · 키워드로 검색">
      </div>
    </div>
    <div id="filters">
      <div class="chips">
        <button class="chip favtoggle" id="fFav" aria-pressed="false">★ 즐겨찾기만</button>
        <button class="chip opentoggle" id="fOpen" aria-pressed="false">🟢 접수중·임박만</button>
        <button class="chip sorttoggle" id="fSort" aria-pressed="false">⏱ 마감 임박순</button>
        <button class="chip remotetoggle" id="fRemote" aria-pressed="false">🖥 원격 응모 가능만</button>
        <button class="chip krtoggle" id="fKR" aria-pressed="false">🇰🇷 한국에서 응모 가능만</button>
      </div>
      <div class="chips" id="rowField"></div>
      <div class="chips" id="rowCat"></div>

]);
function isOnsite(e){ return ONSITE.has(e.name); }

/* ═══════════════ 상태 ═══════════════ */
const NOW = new Date();
const CUR_M = NOW.getMonth()+1;
const LS = {
  get:function(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let favs   = LS.get('toon::fav',[]);
let picks  = LS.get('toon::pick',[]);
let pstat  = LS.get('toon::pstat',{});
let tab='cal', q='', fFav=false, fOpen=false, fSort=false, fRemote=false, fKR=false;
let selField=new Set(), selCat=new Set(), selRg=new Set(), selPK=new Set(), selMK=new Set();

function evKey(e){ return e.name; }
function untilM(m){ if(!m) return 99; return (m - CUR_M + 12) % 12; }

/* 이 앱의 축은 개최월이 아니라 모집(접수) 기간이다.
   months는 '챙길 달'이라 개최월(ev)이 섞여 있으므로 그것만 걷어내면 모집 달이 남는다.
   단 마감월과 개최월이 같은 행사(인크토버 등)는 그 달이 모집 달이기도 하므로 남긴다. */
function subMonths(e){
  if(e.rolling) return [];
  return (e.months||[]).filter(function(m){ return m!==e.ev || m===e.sub; });
}
function isSubbing(e){ return subMonths(e).indexOf(CUR_M) >= 0; }

/* 확정 마감일(dl, MM-DD)이 있으면 남은 날짜를 센다.
   연도는 저장하지 않는다 — 매년 반복되므로 올해 날짜가 지났으면 내년으로 넘긴다. */
function ddays(e){
  if(!e.dl) return null;
  var p = e.dl.split('-'), m = +p[0], d = +p[1];
  var today = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  var t = new Date(NOW.getFullYear(), m-1, d);
  if(t < today) t = new Date(NOW.getFullYear()+1, m-1, d);
  return Math.round((t - today) / 86400000);
}

/* 접수 상태 — 개최는 여기 섞지 않는다(별도 배지로 뺀다) */
function evStatus(e){
  if(e.rolling) return {t:'상시 접수', k:'roll', u:12};
  var dd = ddays(e);
  if(dd !== null){
    if(dd === 0)  return {t:'오늘 마감', k:'urgent', u:0};
    if(dd <= 7)   return {t:'D-'+dd+' 마감', k:'urgent', u:dd/30};
    if(dd <= 45)  return {t:'D-'+dd+' 마감', k:'open',  u:dd/30};
    return {t:'D-'+dd, k:'wait', u:dd/30};
  }
  var u = untilM(e.sub);
  if(!e.sub) return {t:'', k:'', u:99};
  if(u===0) return {t:'이달 마감', k:'urgent', u:0};
  if(u===1) return {t:'다음달 마감', k:'urgent', u:1};
  if(isSubbing(e)) return {t:'접수 중 · D-'+u+'개월', k:'open', u:u};
  if(u<=3) return {t:'접수 임박 · D-'+u+'개월', k:'open', u:u};
  return {t:'다음 모집까지 '+u+'개월', k:'wait', u:u};
}
/* 개최는 부차 정보 */
function holdBadge(e){
  if(!e.ev) return '';
  var v = untilM(e.ev);
  if(v===0) return '<span class="bdg hold">이달 개최</span>';
  if(v===1) return '<span class="bdg hold">다음달 개최</span>';
  return '';
}
function subRange(e){
  var ms = subMonths(e);
  if(!ms.length) return '';
  var sorted = ms.slice().sort(function(a,b){ return a-b; });
  var txt = sorted.length===1 ? MO[sorted[0]] : MO[sorted[0]]+'~'+MO[sorted[sorted.length-1]];
  var dlTxt = e.dl ? ' · 마감 ' + (+e.dl.split('-')[0]) + '/' + (+e.dl.split('-')[1])
                   : (e.sub ? ' · 마감 '+MO[e.sub] : '');
  return '<div class="csub'+(isSubbing(e)?' now':'')+'">📥 모집 '+txt+dlTxt+(isSubbing(e)?' · 지금 접수 기간':'')+'</div>';
}
function isOpenish(e){ var s=evStatus(e); return s.k==='urgent'||s.k==='open'||s.k==='roll'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ═══════════════ 필터 ═══════════════ */
function matchQ(txt){
  if(!q) return true;
  return txt.toLowerCase().indexOf(q.toLowerCase()) >= 0;
}
function filtEvents(){
  return EVENTS.filter(function(e){
    if(selField.size && !e.f.some(function(x){return selField.has(x);})) return false;
    if(selCat.size && !selCat.has(e.c)) return false;
    if(selRg.size && !selRg.has(e.rgroup)) return false;
    if(fFav && favs.indexOf(evKey(e))<0) return false;
    if(fOpen && !isOpenish(e)) return false;
    if(fRemote && isOnsite(e)) return false;
    if(fKR && e.rst) return false;
    if(!matchQ(e.name+' '+e.country+' '+e.desc+' '+e.when+' '+e.rgroup)) return false;
    return true;
  });
}

/* ═══════════════ 렌더 ═══════════════ */
function fbadges(f){
  return f.map(function(x){ return '<span class="fb '+x+'">'+FIELDS[x].emo+' '+FIELDS[x].label+'</span>'; }).join('');
}
/* 규정(분량·러닝타임)과 자격(국적·연령·경력) 줄.
   영상 항목은 확인된 규정이 없을 때 그렇다고 밝힌다 — 러닝타임이 응모 가부를 바로 가르기 때문. */
function isVideo(e){ return e.f.indexOf('a')>=0 || e.f.indexOf('i')>=0; }
function ruleLine(e){
  var h='';
  if(e.run) h += '<div class="crun">'+(isVideo(e)?'⏱':'📐')+' '+esc(e.run)+'</div>';
  // 러닝타임 안내는 작품을 출품하는 영화제·공모에만 (예술인 지원사업엔 해당 없음)
  else if(isVideo(e) && e.c!=='kr') h += '<div class="crun none">⏱ 러닝타임·부문 규정은 공식 요강에서 확인하세요</div>';
  if(e.elig) h += '<div class="celig'+(e.rst?' no':'')+'">👤 '+esc(e.elig)+'</div>';
  return h;
}
function evCard(e){
  var s = evStatus(e), key = evKey(e);
  var isFav = favs.indexOf(key)>=0, isPick = picks.indexOf(key)>=0;
  return '<article class="card'+(isPick?' picked':'')+'" data-k="'+esc(key)+'">'+
    '<div class="cbtns">'+
      '<button class="icb fav'+(isFav?' on':'')+'" data-fav="'+esc(key)+'" title="즐겨찾기">'+(isFav?'★':'☆')+'</button>'+
      '<button class="icb pick'+(isPick?' on':'')+'" data-pick="'+esc(key)+'" title="메일에 담기">'+(isPick?'✓':'+')+'</button>'+
    '</div>'+
    '<div class="ctop"><span class="cdot" style="background:'+CATS[e.c].color+'"></span>'+
      '<span class="cname">'+esc(e.name)+'</span></div>'+
    '<div class="cmeta">'+
      (s.t?'<span class="bdg '+s.k+'">'+s.t+'</span>':'')+ holdBadge(e)+
      (e.rst?'<span class="bdg rst">국내 신청 제한</span>':'')+
      (isOnsite(e)?'<span class="bdg onsite">✈ 현지 참가</span>':'')+
      '<span class="loc">'+esc(e.country)+'</span>'+ fbadges(e.f)+
    '</div>'+
    subRange(e)+ '<div class="cwhen">🗓 '+esc(e.when)+'</div>'+ ruleLine(e)+
    '<div class="cdesc">'+esc(e.desc)+'</div>'+
    '<div class="cfoot">'+
      '<a class="lnk" href="'+esc(e.url)+'" target="_blank" rel="noopener">공식 페이지 →</a>'+
      '<button class="mini" data-copy="'+esc(e.url)+'">🔗 주소 복사</button>'+
    '</div></article>';
}
function renderCal(){
  var list = filtEvents(), h='';
  if(!list.length){ document.getElementById('view-cal').innerHTML='<div class="empty">조건에 맞는 기회가 없습니다. 필터를 줄여보세요.</div>'; return; }
  if(fSort){
    var sorted = list.slice().sort(function(a,b){ return evStatus(a).u - evStatus(b).u; });
    h = '<div class="sec"><div class="sechd"><span class="t">⏱ 마감 임박순</span><span class="c">'+sorted.length+'건</span></div>'+
        '<div class="grid">'+sorted.map(evCard).join('')+'</div></div>';
  } else {
    // 지금 접수 기간인 것 먼저 — 개최가 아니라 모집이 기준이다
    var nowOpen = list.filter(isSubbing).sort(function(a,b){ return evStatus(a).u - evStatus(b).u; });
    if(nowOpen.length){
      h += '<div class="block current featured" id="mnow">'+
           '<div class="mhead"><span class="mo">지금 접수 중</span><span class="cnt">'+nowOpen.length+'건</span>'+
           '<span class="tag">'+MO[CUR_M]+' 모집</span></div>'+
           '<div class="grid">'+nowOpen.map(evCard).join('')+'</div></div>';
    }
    // 이후 달은 '모집 마감이 걸린 달'로 묶는다(개최월에는 카드를 다시 띄우지 않는다)
    var order=[]; for(var i=0;i<12;i++){ order.push(((CUR_M-1+i)%12)+1); }
    order.forEach(function(m){
      var inM = list.filter(function(e){ return !e.rolling && e.sub===m && nowOpen.indexOf(e)<0; });
      if(!inM.length) return;
      inM.sort(function(a,b){ return evStatus(a).u - evStatus(b).u; });
      h += '<div class="block" id="m'+m+'">'+
           '<div class="mhead"><span class="mo">'+MO[m]+' 마감</span><span class="cnt">'+inM.length+'건</span></div>'+
           '<div class="grid">'+inM.map(evCard).join('')+'</div></div>';
    });
    var roll = list.filter(function(e){ return e.rolling; });
    if(roll.length){
      h += '<div class="block" id="mroll"><div class="mhead"><span class="mo">상시 접수</span><span class="cnt">'+roll.length+'건</span></div>'+
           '<div class="grid">'+roll.map(evCard).join('')+'</div></div>';
    }
  }
  document.getElementById('view-cal').innerHTML = h;
}

function renderPub(){
  var list = PUBS.filter(function(p){
    if(selField.size && !p.f.some(function(x){return selField.has(x);})) return false;
    if(selPK.size && !selPK.has(p.k)) return false;
    if(selRg.size && !selRg.has(p.rg)) return false;
    if(fOpen && p.open!==true) return false;
    if(!matchQ(p.n+' '+p.nt+' '+p.rg)) return false;
    return true;
  });
  if(!list.length){ document.getElementById('view-plat').innerHTML='<div class="empty">조건에 맞는 창구가 없습니다.</div>'; return; }
  var h='';
  Object.keys(PKINDS).forEach(function(k){
    var g = list.filter(function(p){ return p.k===k; });
    if(!g.length) return;
    h += '<div class="sec"><div class="sechd"><span class="t">'+PKINDS[k]+'</span><span class="c">'+g.length+'곳</span></div>'+
         '<div class="grid">'+g.map(pubCard).join('')+'</div></div>';
  });
  document.getElementById('view-plat').innerHTML = h;
}

const MKINDS = {news:'뉴스·전문지', crit:'비평·리뷰', cur:'큐레이션·쇼케이스', let:'뉴스레터·커뮤니티'};
function medCard(m){
  return '<article class="card">'+
    '<div class="ctop"><span class="cdot" style="background:'+(m.k==='news'?'#5aa9f6':m.k==='crit'?'#f6b93b':m.k==='cur'?'#c792ea':'#5ec8a0')+'"></span>'+
    '<span class="cname">'+esc(m.n)+'</span></div>'+
    '<div class="cmeta"><span class="loc">'+esc(MKINDS[m.k])+' · '+esc(m.rg)+'</span>'+fbadges(m.f)+'</div>'+
    '<div class="cdesc">'+esc(m.nt)+'</div>'+
    '<div class="cfoot">'+
      '<a class="lnk" href="'+esc(m.ce)+'" target="_blank" rel="noopener">매체 페이지 →</a>'+
      '<button class="mini" data-copy="'+esc(m.ce)+'">🔗 주소 복사</button>'+
      '<button class="mini" data-pitch="'+esc(m.n)+'">✉ 소개 메일 초안</button>'+
    '</div></article>';
}
function renderMed(){
  var list = MEDIA.filter(function(m){
    if(selField.size && !m.f.some(function(x){return selField.has(x);})) return false;
    if(selMK.size && !selMK.has(m.k)) return false;
    if(selRg.size && !selRg.has(m.rg)) return false;
    if(!matchQ(m.n+' '+m.nt+' '+m.rg)) return false;
    return true;
  });
  if(!list.length){ document.getElementById('view-media').innerHTML='<div class="empty">조건에 맞는 매체가 없습니다.</div>'; return; }
  var h='';
  Object.keys(MKINDS).forEach(function(k){
    var g = list.filter(function(m){ return m.k===k; });
    if(!g.length) return;
    h += '<div class="sec"><div class="sechd"><span class="t">'+MKINDS[k]+'</span><span class="c">'+g.length+'곳</span></div>'+
         '<div class="grid">'+g.map(medCard).join('')+'</div></div>';
  });
  document.getElementById('view-media').innerHTML = h;
}

function trendCard(it, color){
  return '<article class="card">'+
    '<div class="ctop"><span class="cdot" style="background:'+color+'"></span><span class="cname">'+esc(it.h)+'</span></div>'+
    (it.n?'<div class="tnum">'+esc(it.n)+'</div>':'')+
    '<div class="cdesc">'+esc(it.d)+'</div>'+
    '<div class="cfoot">'+
      '<a class="lnk" href="'+esc(it.s)+'" target="_blank" rel="noopener">'+esc(it.sn)+' →</a>'+
      '<button class="mini" data-copy="'+esc(it.s)+'">🔗 주소 복사</button>'+
    '</div></article>';
}
function renderTrend(){
  var groups = TRENDS.filter(function(g){
    if(selField.size && !selField.has(g.f) && !(g.f==='t' && selField.has('g'))) return false;
    return true;
  });
  var h = '<div class="tnote">📌 <b>'+TREND_DATE+' 조사 기준 스냅샷</b>입니다. 이 페이지는 자동으로 갱신되지 않으니, 최신 소식은 각 분야 아래 <b>뉴스 소스</b>에서 확인하세요. 수치에는 모두 출처를 달아 두었습니다.</div>';
  groups.forEach(function(g){
    var items = g.items.filter(function(it){ return matchQ(it.h+' '+it.d+' '+(it.n||'')); });
    if(!items.length) return;
    var color = g.f==='t'?'#ff8fb1':(g.f==='a'?'#63d2ff':'#a78bfa');
    h += '<div class="sec"><div class="sechd"><span class="t">'+g.emo+' '+g.title+'</span><span class="c">'+items.length+'건</span></div>'+
         '<div class="grid">'+items.map(function(it){ return trendCard(it,color); }).join('')+'</div>'+
         '<div class="feeds"><span class="group-label">뉴스 소스</span>'+
         g.feeds.map(function(f){ return '<a class="feed" href="'+esc(f.u)+'" target="_blank" rel="noopener">'+esc(f.n)+' →</a>'; }).join('')+
         '</div></div>';
  });
  document.getElementById('view-trend').innerHTML = h || '<div class="empty">조건에 맞는 트렌드가 없습니다.</div>';
}

/* ═══════════════ 컨트롤 ═══════════════ */
function chip(cls,label,pressed,attr){ return '<button class="chip '+cls+'" '+attr+' aria-pressed="'+(pressed?'true':'false')+'">'+label+'</button>'; }
function buildChips(){
  var rf = '<span class="group-label">분야</span>';
  rf += chip('','전체',selField.size===0,'data-fclear="1"');
  Object.keys(FIELDS).forEach(function(k){
    rf += chip('f-'+k, FIELDS[k].emo+' '+FIELDS[k].label, selField.has(k), 'data-field="'+k+'"');
  });
  document.getElementById('rowField').innerHTML = rf;

  var rc = '';
  if(tab==='cal'){
    rc = '<span class="group-label">분류</span>' + chip('','전체',selCat.size===0,'data-cclear="1"');
    Object.keys(CATS).forEach(function(k){
      rc += chip('c-'+k,'<span class="dot" style="background:'+CATS[k].color+'"></span>'+CATS[k].label, selCat.has(k), 'data-cat="'+k+'"');
    });
  } else if(tab==='plat'){
    rc = '<span class="group-label">유형</span>' + chip('','전체',selPK.size===0,'data-pkclear="1"');
    Object.keys(PKINDS).forEach(function(k){ rc += chip('',PKINDS[k], selPK.has(k), 'data-pk="'+k+'"'); });
  } else if(tab==='media'){
    rc = '<span class="group-label">유형</span>' + chip('','전체',selMK.size===0,'data-mkclear="1"');
    Object.keys(MKINDS).forEach(function(k){ rc += chip('',MKINDS[k], selMK.has(k), 'data-mk="'+k+'"'); });
  }
  document.getElementById('rowCat').innerHTML = rc;
  document.getElementById('rowCat').style.display = tab==='trend'?'none':'flex';

  var rr = '<span class="group-label">지역</span>' + chip('','전체',selRg.size===0,'data-rclear="1"');
  RGS.forEach(function(r){ rr += chip('r', r, selRg.has(r), 'data-rg="'+r+'"'); });
  document.getElementById('rowRg').innerHTML = rr;
  document.getElementById('rowRg').style.display = tab==='trend'?'none':'flex';

  var mn='';
  if(tab==='cal'){
    mn += '<a class="mbtn now" href="#mnow">지금 접수 중</a>';
    for(var i=0;i<12;i++){
      var m = ((CUR_M-1+i)%12)+1;
      mn += '<a class="mbtn" href="#m'+m+'">'+MO[m]+' 마감</a>';
    }
    mn += '<a class="mbtn" href="#mroll">상시</a>';
  }
  document.getElementById('monthnav').innerHTML = mn;
  document.getElementById('monthnav').style.display = tab==='cal'?'flex':'none';
  document.getElementById('fSort').style.display = tab==='cal'?'':'none';
  document.getElementById('fRemote').style.display = tab==='cal'?'':'none';
  document.getElementById('fKR').style.display = tab==='cal'?'':'none';
  document.getElementById('fFav').style.display = tab==='cal'?'':'none';
  document.getElementById('fOpen').style.display = tab==='media'?'none':'';
  document.getElementById('fOpen').textContent = tab==='cal'?'🟢 접수중·임박만':'🟢 접수중만';
  syncFilBtn();
}
/* 버튼이 지금 무엇을 하는지(열기/접기)와 몇 개가 걸려 있는지 항상 드러낸다 */
function syncFilBtn(){
  var open = document.getElementById('filters').classList.contains('open');
  var nOn = selField.size + selCat.size + selRg.size + selPK.size + selMK.size
          + (fFav?1:0) + (fOpen?1:0) + (fSort?1:0) + (fRemote?1:0) + (fKR?1:0);
  document.getElementById('filArrow').textContent = open ? '▲' : '▼';
  document.getElementById('filLabel').textContent = open ? '필터 접기' : '필터 열기';
  document.getElementById('filN').textContent = nOn ? ' · ' + nOn : '';
}
function updNote(){
  var t = {
    cal:'기준은 개최일이 아니라 <b>모집(접수) 기간</b>입니다 — 지금 접수 중인 것이 맨 위, 그 아래는 <b>마감 달</b>로 묶었습니다. 개최 시기는 카드 안에서 참고만 하세요. 카드 우측 <b>+</b>로 담아 친구에게 메일로 보낼 수 있습니다. 접수 시기는 <b>연도별로 바뀌므로</b> 반드시 공식 페이지에서 확인하세요.',
    plat:'<b>투고·연재·펀딩 창구</b>입니다. 공개된 공식 접수 경로만 실었고, 개인 이메일은 넣지 않았습니다. 카드 우측 상태 버튼으로 <b>투고 진행 상황</b>을 기록해 두세요(이 브라우저에 저장).',
    trend:'웹툰 · 애니메이션 · AI 영상 <b>세 분야를 나눠</b> 시장 흐름과 인기 콘텐츠를 정리했습니다. 수치는 모두 출처를 달았고, <b>정적 페이지라 자동 갱신되지 않으니</b> 최신 소식은 각 분야 하단 뉴스 소스를 쓰세요.',
    media:'<b>리뷰·소개를 노려볼 매체</b>입니다. 각 매체의 공개 제보/문의 페이지로 연결됩니다. <b>소개 메일 초안</b>은 영문/국문 템플릿을 만들어 주며 발송은 직접 하세요.'
  };
  document.getElementById('note').innerHTML = t[tab];
}
function renderAll(){
  buildChips(); updNote();
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.getElementById('view-'+tab).classList.add('active');
  document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.tab===tab?'true':'false'); });
  if(tab==='cal') renderCal(); else if(tab==='plat') renderPub(); else if(tab==='media') renderMed(); else renderTrend();
  updStats();
}
function updStats(){
  document.getElementById('s1').textContent = EVENTS.length;
  document.getElementById('s2').textContent = EVENTS.filter(function(e){ return evStatus(e).k==='urgent'; }).length;
  document.getElementById('s4').textContent = EVENTS.filter(function(e){ return isSubbing(e) || e.rolling; }).length;
  document.getElementById('s3').textContent = favs.length;
  document.getElementById('n-cal').textContent = EVENTS.length;
  document.getElementById('n-plat').textContent = PUBS.length;
  document.getElementById('n-media').textContent = MEDIA.length;
  document.getElementById('fc').textContent = EVENTS.length;
  document.getElementById('fp').textContent = PUBS.length;
  document.getElementById('fm').textContent = MEDIA.length;
  var n = picks.length;
  document.getElementById('selN').textContent = n;
  document.getElementById('selbar').classList.toggle('on', n>0);
}

/* ═══════════════ 메일 ═══════════════ */
function pickedEvents(){ return EVENTS.filter(function(e){ return picks.indexOf(evKey(e))>=0; }); }
function mailText(){
  var list = pickedEvents();
  var head = '[TOON RADAR] 챙겨볼 만한 기회 '+list.length+'건 (기준 '+NOW.getFullYear()+'.'+CUR_M+'월 · 모집 기간 순)\n\n';
  var body = list.slice().sort(function(a,b){ return evStatus(a).u - evStatus(b).u; }).map(function(e){
    var s = evStatus(e);
    var ms = subMonths(e);
    return '■ '+e.name+'\n'+
           '   · '+e.country+' / '+e.f.map(function(x){return FIELDS[x].label;}).join(', ')+(s.t?' / '+s.t:'')+'\n'+
           (ms.length?'   · 모집: '+MO[ms[0]]+'~'+MO[ms[ms.length-1]]+(e.sub?' (마감 '+MO[e.sub]+')':'')+'\n':'   · 모집: 상시\n')+
           '   · 일정: '+e.when+'\n'+
           (e.run?'   · 규정: '+e.run+'\n':'')+
           (e.elig?'   · 자격: '+e.elig+'\n':'')+
           '   · '+e.desc+'\n'+
           '   · '+e.url+'\n';
  }).join('\n');
  return head + body + '\n마감 시기는 연도별로 달라질 수 있으니 공식 페이지에서 꼭 확인하세요.';
}
function pitchText(name){
  return '제목: [작품 소개] (작품명) — (한 줄 소개)\n\n'+
    'To: '+name+' 편집부\n\n'+
    '안녕하세요, (작가명)입니다.\n'+
    '(작품명)은 (장르/분량)의 (만화·웹툰·애니) 작업입니다. (한 문장 훅)\n\n'+
    '· 작품 링크: \n'+
    '· 미리보기 이미지/영상: \n'+
    '· 작가 소개·이력: \n'+
    '· 보도자료(PDF): \n\n'+
    '리뷰나 소개를 검토해 주시면 감사하겠습니다. 필요하시면 고화질 이미지와 추가 자료를 바로 보내드리겠습니다.\n\n'+
    '감사합니다.\n(작가명) / (이메일) / (SNS)\n\n'+
    '─────────── English ───────────\n\n'+
    'Subject: [Submission] (Title) — (one-line pitch)\n\n'+
    'Hello '+name+' team,\n\n'+
    'I am (name), an independent creator from South Korea.\n'+
    '(Title) is a (genre) (comic/webtoon/animated short). (One-sentence hook.)\n\n'+
    '· Link: \n· Preview images/video: \n· Bio: \n· Press kit (PDF): \n\n'+
    'I would be grateful if you would consider it for a review or feature. High-resolution assets are available on request.\n\n'+
    'Thank you,\n(name) / (email) / (social)';
}
function openModal(title, body){
  document.getElementById('mTtl').textContent = title;
  document.getElementById('mBody').value = body;
  document.getElementById('modal').classList.add('on');
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
function copyText(t, el){
  var done = function(){ if(el){ var o=el.textContent; el.textContent='✓ 복사됨'; setTimeout(function(){ el.textContent=o; },1200);} };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, function(){ fallbackCopy(t); done(); }); }
  else { fallbackCopy(t); done(); }
}
function fallbackCopy(t){
  var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta);
}

/* ═══════════════ 이벤트 배선 ═══════════════ */
document.addEventListener('click', function(ev){
  var t = ev.target.closest('button, a');
  if(!t) return;

  if(t.dataset.tab){ tab=t.dataset.tab; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.id==='filToggle' || t.id==='filClose'){
    var fb = document.getElementById('filters');
    fb.dataset.touched = '1';
    var nowOpen = (t.id==='filClose') ? (fb.classList.remove('open'), false) : fb.classList.toggle('open');
    document.getElementById('filToggle').setAttribute('aria-pressed', nowOpen);
    syncFilBtn();
    if(t.id==='filClose') document.getElementById('filToggle').scrollIntoView({block:'nearest'});
    return;
  }

  if(t.dataset.fclear){ selField.clear(); renderAll(); return; }
  if(t.dataset.field){ var k=t.dataset.field; selField.has(k)?selField.delete(k):selField.add(k); renderAll(); return; }
  if(t.dataset.cclear){ selCat.clear(); renderAll(); return; }
  if(t.dataset.cat){ var c=t.dataset.cat; selCat.has(c)?selCat.delete(c):selCat.add(c); renderAll(); return; }
  if(t.dataset.rclear){ selRg.clear(); renderAll(); return; }
  if(t.dataset.rg){ var r=t.dataset.rg; selRg.has(r)?selRg.delete(r):selRg.add(r); renderAll(); return; }
  if(t.dataset.pkclear){ selPK.clear(); renderAll(); return; }
  if(t.dataset.pk){ var p=t.dataset.pk; selPK.has(p)?selPK.delete(p):selPK.add(p); renderAll(); return; }
  if(t.dataset.mkclear){ selMK.clear(); renderAll(); return; }
  if(t.dataset.mk){ var m=t.dataset.mk; selMK.has(m)?selMK.delete(m):selMK.add(m); renderAll(); return; }

  if(t.id==='fFav'){ fFav=!fFav; t.setAttribute('aria-pressed',fFav); renderAll(); return; }
  if(t.id==='fOpen'){ fOpen=!fOpen; t.setAttribute('aria-pressed',fOpen); renderAll(); return; }
  if(t.id==='fSort'){ fSort=!fSort; t.setAttribute('aria-pressed',fSort); renderAll(); return; }
  if(t.id==='fRemote'){ fRemote=!fRemote; t.setAttribute('aria-pressed',fRemote); renderAll(); return; }
  if(t.id==='fKR'){ fKR=!fKR; t.setAttribute('aria-pressed',fKR); renderAll(); return; }

  if(t.dataset.fav){
    var fk=t.dataset.fav, i=favs.indexOf(fk);
    if(i>=0) favs.splice(i,1); else favs.push(fk);
    LS.set('toon::fav',favs); renderAll(); return;
  }
  if(t.dataset.pick){
    var pk=t.dataset.pick, j=picks.indexOf(pk);
    if(j>=0) picks.splice(j,1); else picks.push(pk);
    LS.set('toon::pick',picks); renderAll(); return;
  }
  if(t.dataset.copy){ copyText(t.dataset.copy, t); return; }
  if(t.dataset.pst){
    var pn=t.dataset.pst; pstat[pn] = ((pstat[pn]||0)+1) % PSTATES.length;
    LS.set('toon::pstat',pstat); renderPub(); return;
  }
  if(t.dataset.pitch){ openModal('소개 메일 초안 — '+t.dataset.pitch, pitchText(t.dataset.pitch)); return; }

  if(t.id==='selMail'){ if(!picks.length) return; openModal('친구에게 보낼 메일', mailText()); return; }
  if(t.id==='selCopy'){ if(!picks.length) return; copyText(mailText(), t); return; }
  if(t.id==='selClear'){ picks=[]; LS.set('toon::pick',picks); renderAll(); return; }

  if(t.id==='mX'||t.id==='mClose'){ closeModal(); return; }
  if(t.id==='mCopy'){ copyText(document.getElementById('mBody').value, t); return; }
  if(t.id==='mSend'){
    var to = document.getElementById('mTo').value.trim();
    var body = document.getElementById('mBody').value;
    var subj = document.getElementById('mTtl').textContent;
    var href = 'mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body.slice(0,1500));
    window.location.href = href; return;
  }
});
document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
document.getElementById('q').addEventListener('input', function(e){ q=e.target.value; if(tab==='cal') renderCal(); else if(tab==='plat') renderPub(); else if(tab==='media') renderMed(); else renderTrend(); });

document.getElementById('tdy').textContent = NOW.getFullYear()+'.'+String(CUR_M).padStart(2,'0')+'.'+String(NOW.getDate()).padStart(2,'0');

/* 폭을 직접 재서 좁으면 접힌 채로 둔다. 아티팩트가 iframe 안에서 뜰 때
   CSS 미디어쿼리가 기대와 다르게 잡히는 경우가 있어 JS로 확정한다. */
function applyWidth(){
  var w = Math.min(window.innerWidth || 9999, document.documentElement.clientWidth || 9999);
  var narrow = w <= 760;
  document.body.classList.toggle('narrow', narrow);
  var fb = document.getElementById('filters');
  if(!fb.dataset.touched){                 // 사용자가 직접 여닫기 전까지만 자동 판단
    fb.classList.toggle('open', !narrow);
    document.getElementById('filToggle').setAttribute('aria-pressed', !narrow);
  }
  syncFilBtn();
}
window.addEventListener('resize', applyWidth);
applyWidth();
renderAll();
</script>
